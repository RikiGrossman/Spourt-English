<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58cc02" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Spourt English – לומדים אנגלית</title>
  </head>
  <body>
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('spourt-english:settings:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <noscript>כדי להשתמש ב־Spourt English צריך להפעיל JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
